<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Upload</title>
  <link rel="stylesheet" href="style.css">

  <!-- Font --->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
  
</head>
<body>

  <div class="container">

    <h1>Simulador de Upload</h1>

    <div class="entrada">
      <input type="text" id="arquivo" placeholder="Nome do arquivo">
      <button onclick="adicionarUpload()">
        Adicionar Upload
      </button>
    </div>

    <div class="fila-box">
      <h2>Fila de Uploads</h2>

      <ul id="fila"></ul>
    </div>

    <button class="processar" onclick="processarUpload()">
      Processar Upload
    </button>

    <div class="progresso-box">

      <h2>Progresso</h2>

      <div class="barra">
        <div id="progresso"></div>
      </div>

      <p id="status">
        Nenhum upload em andamento
      </p>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
