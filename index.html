<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Upload - Fila</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <section class="coluna-central">
            <h1 class="titulo-pagina">Simulador de Upload</h1>

            <div class="caixa-envio">
                <p class="dica-envio">Insira o nome do arquivo</p>
                <div class="linha-input">
                    <input type="text" id="arquivo" placeholder="ex: relatorio.pdf" autocomplete="off">
                </div>
                <button class="botao-adicionar" onclick="adicionarArquivo()">+ Adicionar à fila</button>
            </div>
        </section>

        <section class="coluna-esquerda">
            <h2 class="titulo-coluna">Fila de uploads</h2>

            <div class="painel-fila">
                <div class="lista-cards" id="cartoes-fila">
                    <p class="mensagem-vazia" id="fila-vazia">Nenhum arquivo na fila</p>
                </div>
                <button class="botao-processar" onclick="processarUpload()">Processar upload</button>
            </div>
        </section>

        <section class="coluna-direita">
            <h2 class="titulo-coluna">Histórico</h2>

            <div class="painel-historico">
                <div id="lista-concluidos">
                    <p class="mensagem-vazia" id="historico-vazio">Nenhum arquivo processado</p>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
